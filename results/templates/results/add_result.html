{% extends 'results/base.html' %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h2 class="fw-bold mb-4" style="color: #1F4E79;">Add New Result</h2>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-bold">Student</label>
                    <select name="student" class="form-select" required>
                        <option value="">-- Select Student --</option>
                        {% for student in students %}
                        <option value="{{ student.id }}">
                            {{ student.name }} ({{ student.roll_number }})
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Subject</label>
                    <select name="subject" class="form-select" required>
                        <option value="">-- Select Subject --</option>
                        {% for subject in subjects %}
                        <option value="{{ subject.id }}">
                            {{ subject.name }} ({{ subject.code }})
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Marks Obtained</label>
                    <input type="number" name="marks_obtained" class="form-control"
                           placeholder="e.g. 85" min="0" max="100" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Total Marks</label>
                    <input type="number" name="total_marks" class="form-control"
                           value="100" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Grade</label>
                    <select name="grade" class="form-select" required>
                        <option value="">-- Select Grade --</option>
                        <option value="A+">A+</option>
                        <option value="A">A</option>
                        <option value="B+">B+</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                        <option value="F">F</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Semester</label>
                    <input type="text" name="semester" class="form-control"
                           placeholder="e.g. Fall 2024" required>
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-success btn-lg">
                        Save Result
                    </button>
                    <a href="{% url 'result_list' %}" class="btn btn-outline-secondary">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
